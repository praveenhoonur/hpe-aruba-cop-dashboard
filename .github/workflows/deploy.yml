name: Deploy to production

# Runs on every push to main: validates the code on this repo's self-hosted
# runner (installed directly on the production host, 10.97.48.59, since it's
# a private IP unreachable from GitHub-hosted runners), then syncs the
# checked-out code into the live app directory and restarts the service.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, aruba-cop]
    env:
      APP_DIR: /home/aruba/hpe-aruba-cop-dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all JavaScript files
        run: |
          set -e
          # Browser-facing scripts under public/ reference window/document and
          # can't be safely required(), so they're parsed (not executed) via
          # `new Function(...)` instead of `node --check`.
          find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './public/*' \
            -print0 | xargs -0 -n1 node --check
          for f in public/*.js; do
            node -e "new Function(require('fs').readFileSync('$f', 'utf8')); console.log('$f OK')"
          done

      - name: Sync files into production app directory
        run: |
          set -e
          mkdir -p "$APP_DIR"
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'uploads/*' \
            --exclude '.env' \
            ./ "$APP_DIR/"

      - name: Install production dependencies in app directory
        run: |
          set -e
          cd "$APP_DIR" && npm ci --omit=dev

      - name: Restart dashboard service
        run: |
          set -e
          sudo systemctl restart hpe-aruba-cop-dashboard.service
          sleep 2
          sudo systemctl is-active hpe-aruba-cop-dashboard.service

      - name: Verify deployment is live
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -e
          status=$(curl -s -o /dev/null -w "%{http_code}" -u "$DEPLOY_USER:$DEPLOY_PASSWORD" "http://localhost:3000/")
          echo "Homepage status: $status"
          if [ "$status" != "200" ]; then
            echo "Deployment verification failed (expected 200, got $status)"
            exit 1
          fi
